<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #17212b;
            color: #fff;
            height: 90px;
            overflow: hidden;
            cursor: pointer;
            border-radius: 12px;
            border: 1px solid #2b5278;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(110%);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideOut {
            from {
                opacity: 1;
                transform: translateX(0);
            }

            to {
                opacity: 0;
                transform: translateX(110%);
            }
        }

        body.closing {
            animation: slideOut 0.3s ease-in forwards;
        }

        .container {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            height: 100%;
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #2b5278;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            color: #5baaff;
            flex-shrink: 0;
        }

        .content {
            flex: 1;
            min-width: 0;
        }

        .app-name {
            font-size: 10px;
            color: #00c896;
            margin-bottom: 3px;
        }

        .name {
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .message {
            font-size: 12px;
            color: #a0b8cc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .close-btn {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: #a0b8cc;
            cursor: pointer;
            font-size: 11px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.18);
        }

        .progress {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 2px;
            background: #00c896;
            animation: shrink 4s linear forwards;
            border-radius: 0 0 12px 12px;
        }

        @keyframes shrink {
            from {
                width: 100%;
            }

            to {
                width: 0%;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="avatar" id="avatar">?</div>
        <div class="content">
            <div class="app-name">🔒 AIR.GAP</div>
            <div class="name" id="name">...</div>
            <div class="message" id="msg">...</div>
        </div>
        <button class="close-btn" id="close">✕</button>
    </div>
    <div class="progress"></div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const name = decodeURIComponent(params.get('name') || '');
        const content = decodeURIComponent(params.get('content') || '');

        document.getElementById('name').textContent = name;
        document.getElementById('msg').textContent = content;
        document.getElementById('avatar').textContent = name.charAt(0).toUpperCase();

        const timer = setTimeout(closeNotif, 4000);

        function closeNotif() {
            clearTimeout(timer);
            document.body.classList.add('closing');
            setTimeout(() => window.close(), 300);
        }

        document.getElementById('close').onclick = (e) => {
            e.stopPropagation();
            closeNotif();
        };

        document.body.addEventListener('click', async () => {
            try {
                const { invoke } = window.__TAURI__.core;
                await invoke('focus_main_window');
            } catch (e) { }
            closeNotif();
        });
    </script>
</body>

</html>
